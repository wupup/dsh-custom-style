name: Feature request
description: Suggest a capability or an improvement
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two things worth checking before filing:

        - If your idea is "style this specific component", the **Element picker** tab
          already does it without any code change — no issue needed.
        - If your idea is a whole look, a **preset pack** (or a local JSON you can
          share) may already be enough. See CONTRIBUTING.md → "Adding a preset pack".

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the goal, not the implementation. What can't you do today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A concrete proposal if you have one. Sketches and mock JSON welcome.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: >
        For example: a snippet in the Global CSS tab, a hand-edited custom-style.json,
        or a different plugin. This tells us how much the gap actually costs.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: This plugin deliberately keeps a narrow remit. Please confirm the fit.
      options:
        - label: This is about styling or appearance (not session/tool/model behaviour)
          required: true
        - label: This can be built without adding a runtime dependency
          required: true
